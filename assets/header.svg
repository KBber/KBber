<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KBber — Agent · LLM · Reinforcement Learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.30"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#22304a"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" rx="12" fill="url(#bg)"/>
  <rect x="560" y="0" width="340" height="240" fill="url(#dots)" opacity="0.45"/>
  <rect x="560" y="0" width="12" height="240" fill="#0d1117" opacity="0.9"/>

  <!-- agent graph metaphor -->
  <g stroke="url(#edge)" stroke-width="1.6" fill="none">
    <line x1="640" y1="70"  x2="730" y2="45"/>
    <line x1="730" y1="45"  x2="815" y2="75"/>
    <line x1="640" y1="70"  x2="675" y2="125"/>
    <line x1="675" y1="125" x2="765" y2="130" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="765" y1="130" x2="815" y2="75"/>
    <line x1="765" y1="130" x2="850" y2="155"/>
    <line x1="675" y1="125" x2="655" y2="185"/>
    <line x1="655" y1="185" x2="745" y2="200"/>
    <line x1="745" y1="200" x2="850" y2="155"/>
    <line x1="765" y1="130" x2="745" y2="200" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle cx="675" cy="125" r="26" fill="url(#glow)">
      <animate attributeName="r" values="20;30;20" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="70"  r="5" fill="#22d3ee"/>
    <circle cx="730" cy="45"  r="6" fill="#8b5cf6">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="815" cy="75"  r="4" fill="#67e8f9"/>
    <circle cx="675" cy="125" r="8" fill="#06b6d4"/>
    <circle cx="675" cy="125" r="3.2" fill="#e6edf3"/>
    <circle cx="765" cy="130" r="5.5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.5;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="155" r="4" fill="#22d3ee"/>
    <circle cx="655" cy="185" r="5" fill="#8b5cf6"/>
    <circle cx="745" cy="200" r="6" fill="#22d3ee">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <rect x="56" y="52" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="54" y="118" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" fill="#e6edf3">KBber</text>
  <text x="56" y="152" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="19" font-weight="600" fill="url(#accent)">Agent · LLM · Reinforcement Learning</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="13">
    <rect x="56"  y="174" width="94" height="28" rx="7" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.4)"/>
    <text x="70" y="192" fill="#67e8f9">GraphRAG</text>
    <rect x="158" y="174" width="66" height="28" rx="7" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.4)"/>
    <text x="172" y="192" fill="#c4b5fd">GRPO</text>
    <rect x="232" y="174" width="88" height="28" rx="7" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.4)"/>
    <text x="246" y="192" fill="#67e8f9">LLM · RL</text>
  </g>
</svg>
